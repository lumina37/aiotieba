# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: aiotieba
site_description: aiotieba开发文档
site_url: https://aiotieba.cc/

strict: true

repo_name: lumina37/aiotieba
repo_url: https://github.com/lumina37/aiotieba/
edit_uri: edit/develop/docs/

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    # 导航
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    # 搜索
    - search.suggest
    - search.highlight
    - search.share
    # 内容
    - content.code.copy
    - content.tooltips
    - content.action.edit

nav:
  - 介绍: index.md
  - 教程:
      - 入门教程: tutorial/start.md
      - 异步编程入门教程: tutorial/async_start.md
      - 实用微脚本合集: tutorial/many_utils.md
  - 参考文档:
      - 客户端 (Client): ref/client.md
      - 枚举: ref/enums.md
      - 配置: ref/config.md
      - 异常处理: ref/exception.md
      - 类型定义: ref/classdef/

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: relative_to_docs
  links:
    not_found: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: warn

markdown_extensions:
  # Python Markdown 官方扩展
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: 复制本节链接
      toc_depth: 3
  # PyMdown Extensions（mkdocs-material自带）
  - pymdownx.betterem
  - pymdownx.blocks.admonition
  - pymdownx.blocks.details
  - pymdownx.blocks.tab
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tilde

plugins:
  - search:
      lang: zh
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      locale: zh
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            members_order: source
            show_bases: false
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            signature_crossrefs: true
            show_signature_annotations: true
            filters: public

extra_css:
  - css/custom.css
