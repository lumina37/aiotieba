[project]
name = "aiotieba"
version = "4.9.0"
description = "Asynchronous I/O Client for Baidu Tieba"
authors = [{ name = "lumina37", email = "starry.qvq@gmail.com" }]
urls = { Repository = "https://github.com/lumina37/aiotieba/", Documentation = "https://aiotieba.cc/" }
readme = "README.md"
license = "Unlicense"
keywords = ["baidu", "tieba"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP :: Session",
  "Typing :: Typed",
]
requires-python = ">=3.11,<3.16"
dependencies = [
  "aiohttp>=3.14,<4;python_version<'3.15'",
  "aiohttp>=3.14.4,<4;python_version>='3.15'",
  "lxml>=4.9.2,<7;python_version=='3.11'",
  "lxml>=4.9.3,<7;python_version=='3.12'",
  "lxml>=5.3.0,<7;python_version=='3.13'",
  "lxml>=6.0.1,<7;python_version=='3.14'",
  "lxml>=6.1.2,<7;python_version>='3.15'",
  "protobuf>=4.21.1,<8",
  "cryptography>=45.0.0,<51",
]

[project.optional-dependencies]
img = [
  "opencv-contrib-python-headless>=4.6.0.66,<6",
]
img-gui = [
  "opencv-contrib-python>=4.6.0.66,<6",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "pytest-rerunfailures==16.7"]
docs = [
  "mkdocs-material",
  "mkdocstrings[python]",
  "mkdocs-gen-files",
  "mkdocs-literate-nav",
]

[build-system]
requires = ["scikit-build-core>=1.1,<1.2"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
sdist.inclusion-mode = "explicit"
sdist.include = [
  "README.md",
  "LICENSE",
  "pyproject.toml",
  "CMakeLists.txt",
  "src/**/*.py",
  "src/**/*.pyi",
  "src/**/*.c",
  "src/**/*.h",
  "src/**/CMakeLists.txt",
]
sdist.resolve-symlinks = "error"
wheel.exclude = ["*.c", "*.h", "*.txt"]

[[tool.scikit-build.generate]]
path = "aiotieba/__version__.py"
template = '''__version__ = "${version}"'''
